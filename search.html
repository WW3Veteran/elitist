<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<link rel="icon" type="image/png" href="favicon2.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Sticky black header */
  header {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    background-color: #000000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 0 24px;
    min-height: 64px;
    z-index: 1000;
  }

  /* Logo on the left */
  .logo-link {
    display: flex;
    align-items: center;
    height: 64px;
  }

  .logo-link img {
    height: 40px;
    width: auto;
    display: block;
  }

  /* Hamburger button (hidden on desktop) */
  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 26px;
    height: 18px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .hamburger span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: #ffffff;
    border-radius: 1px;
  }

  /* Nav links on the right */
  nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 24px;
    padding: 8px 0;
  }

  nav a {
    color: #FAFAFA;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
  }

  nav a:hover {
    color: #cccccc;
  }

  /* Search bar */
  .search-container {
    display: flex;
    justify-content: center;
    padding: 40px 24px;
    width: 100%;
  }

  .search-container form {
    position: relative;
    display: flex;
    width: 100%;
    max-width: 900px;
  }

  .search-container input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12.8px;
    border: 1px solid #cccccc;
    border-right: none;
    border-radius: 4px 0 0 4px;
    outline: none;
  }

  .search-container input[type="text"]:focus {
    border-color: #000000;
  }

  .search-container button {
    padding: 10px 20px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12.8px;
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #000000;
    border-radius: 0 4px 4px 0;
    cursor: pointer;
  }

  .search-container button:hover {
    background-color: #333333;
  }

  /* Search dropdown */
  .search-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background-color: #ffffff;
    border: 1px solid #cccccc;
    border-radius: 4px;
    max-height: 280px;
    overflow-y: auto;
    z-index: 900;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    text-align: left;
  }

  .search-dropdown.open {
    display: block;
  }

  .search-dropdown-item {
    padding: 10px 14px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: #333333;
    cursor: pointer;
  }

  .search-dropdown-item:hover,
  .search-dropdown-item.active {
    background-color: #f2f2f2;
  }

  .search-dropdown-empty {
    padding: 10px 14px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: #999999;
  }

  main {
    padding: 0;
    flex: 1 0 auto;
  }

  /* Divider line beneath search bar */
  .divider {
    max-width: 1100px;
    margin: 0 auto;
    border: none;
    border-top: 1px solid #cccccc;
  }

  /* Comparison status line */
  .compare-status {
    max-width: 1400px;
    margin: 24px auto 0;
    padding: 0 24px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: #666666;
    text-align: center;
  }

  /* Comparison cards */
  .compare-cards-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: 24px;
  }

  .compare-card {
    position: relative;
    flex: 1 1 280px;
    max-width: 320px;
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 12px;
    padding: 24px 20px 20px;
    text-align: left;
  }

  .compare-card-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background-color: #000000;
    color: #ffffff;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .compare-card-remove:hover {
    background-color: #b31b1b;
  }

  .compare-card-title {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    color: #b31b1b;
    padding-right: 30px;
    margin-bottom: 8px;
  }

  .compare-card-sub {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #666666;
    margin-bottom: 16px;
  }

  .compare-card-section-title {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #000000;
    margin-top: 16px;
    margin-bottom: 8px;
  }

  .compare-card-placement-row {
    display: flex;
    justify-content: space-between;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #333333;
    padding: 6px 0;
    border-bottom: 1px solid #eeeeee;
  }

  .compare-card-placement-label {
    font-weight: bold;
  }

  .compare-card-bar-row {
    margin-bottom: 12px;
  }

  .compare-card-bar-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12.5px;
    color: #333333;
    margin-bottom: 4px;
  }

  .compare-card-bar-label {
    font-weight: bold;
  }

  .compare-card-bar-value {
    color: #666666;
    white-space: nowrap;
    padding-left: 8px;
  }

  .compare-card-bar-track {
    width: 100%;
    height: 10px;
    background-color: #eeeeee;
    border-radius: 5px;
    overflow: hidden;
  }

  .compare-card-bar-fill {
    height: 100%;
    border-radius: 5px;
  }

  .compare-card-no-data {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-style: italic;
    color: #999999;
    margin-bottom: 8px;
  }

  .compare-empty-state {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 24px 60px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: #999999;
    text-align: center;
  }

  /* Footer */
  footer {
    flex-shrink: 0;
    background-color: #000000;
    color: #FAFAFA;
    padding: 32px 24px;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
  }

  footer p {
    font-size: 14px;
    margin-bottom: 12px;
  }

  footer p:last-child {
    margin-bottom: 0;
  }

  /* Mobile friendliness */
  @media (max-width: 600px) {
    header {
      padding: 0 16px;
      justify-content: space-between;
      text-align: center;
    }

    .logo-link {
      height: 56px;
    }

    .logo-link img {
      height: 32px;
    }

    .hamburger {
      display: flex;
    }

    nav {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      padding: 0;
    }

    nav.open {
      display: flex;
    }

    nav a {
      font-size: 16px;
      width: 100%;
      padding: 12px 0;
      border-top: 1px solid #333333;
    }

    .search-container {
      padding: 24px 16px;
    }

    .search-container input[type="text"],
    .search-container button {
      font-size: 11.2px;
      padding: 10px 12px;
    }

    .compare-cards-container {
      flex-direction: column;
      padding: 16px 16px 40px;
    }

    .compare-card {
      max-width: 100%;
      width: 100%;
    }

    footer {
      padding: 24px 16px;
    }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <img src="logo2.png" alt="Logo">
  </a>
  <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav id="main-nav">
    <a href="readme.html">README</a>
    <a href="search.html">Club Search</a>
    <a href="network.html">Networking</a>
    <a href="mailto:joinelitist@gmail.com">Contact</a>
  </nav>
</header>

<main>
  <div class="search-container">
    <form id="search-form" autocomplete="off">
      <input type="text" id="search-input" name="q" placeholder="Search by club" aria-label="Search">
      <button type="submit">Search</button>
      <div class="search-dropdown" id="search-dropdown"></div>
    </form>
  </div>
  <hr class="divider">
  <p class="compare-status" id="compare-status"></p>
  <div class="compare-cards-container" id="compare-cards-container"></div>
  <p class="compare-empty-state" id="compare-empty-state">Search for a club above to add it to the comparison.</p>
</main>

<footer>
  <p>&copy; 2026 Elitist. All rights reserved. For informational purposes only.</p>
  <p>Not affiliated with Cornell University or any of its student organizations</p>
  <p>Email joinelitist@gmail.com to report any errors</p>
</footer>

<script>
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const mainNav = document.getElementById('main-nav');

  hamburgerBtn.addEventListener('click', function () {
    const isOpen = mainNav.classList.toggle('open');
    hamburgerBtn.setAttribute('aria-expanded', isOpen);
  });

  /* ---- Data & state ---- */
  const MAX_CLUBS = 4;
  let clubsData = {};
  let clubNames = [];
  let selectedClubs = [];

  const placementLabels = {
    faang: 'FAANG',
    mangos: 'MANGOS',
    mbb: 'MBB',
    big_4: 'Big 4',
    bulge_bracket: 'Bulge Bracket'
  };

  // Same 5 colors used for the card highlights on index.html
  // (FAANG, MANGOS, Bulge Bracket, MBB, Big Four)
  const barColors = ['#ff7870', '#ff964f', '#ffd95b', '#c5ff9e', '#7cb7e8'];

  // Freshman -> Senior, light to dark blue
  const gradYearColors = ['#cfe8ff', '#9cc9f5', '#6badeb', '#3b8ee0'];

  // Major bars, dark to light shades of the site's accent red
  const majorColors = ['#b31b1b', '#cc4444', '#e07070', '#ec9c9c', '#f5c6c6'];

  const searchInput = document.getElementById('search-input');
  const searchDropdown = document.getElementById('search-dropdown');
  const searchForm = document.getElementById('search-form');
  const cardsContainer = document.getElementById('compare-cards-container');
  const emptyState = document.getElementById('compare-empty-state');
  const statusLine = document.getElementById('compare-status');

  fetch('clubs.json')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      clubsData = data;
      clubNames = Object.keys(data);

      // If a club was passed in via ?club=NAME from the homepage, add it now
      const params = new URLSearchParams(window.location.search);
      const initialClub = params.get('club');
      if (initialClub) {
        const match = clubNames.find(function (name) {
          return name.toLowerCase() === initialClub.toLowerCase();
        });
        if (match) {
          addClub(match);
        }
      }

      updateEmptyState();
    })
    .catch(function (err) {
      console.error('Could not load clubs.json:', err);
    });

  /* ---- Dropdown ---- */
  function renderDropdown(matches, query) {
    searchDropdown.innerHTML = '';

    if (!query) {
      searchDropdown.classList.remove('open');
      return;
    }

    if (matches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'search-dropdown-empty';
      empty.textContent = 'No matching clubs found';
      searchDropdown.appendChild(empty);
      searchDropdown.classList.add('open');
      return;
    }

    matches.slice(0, 8).forEach(function (name) {
      const item = document.createElement('div');
      item.className = 'search-dropdown-item';
      item.textContent = name;
      item.addEventListener('click', function () {
        addClub(name);
        searchInput.value = '';
        searchDropdown.classList.remove('open');
      });
      searchDropdown.appendChild(item);
    });

    searchDropdown.classList.add('open');
  }

  function getMatches(query) {
    const lowerQuery = query.toLowerCase();
    return clubNames.filter(function (name) {
      return name.toLowerCase().includes(lowerQuery);
    });
  }

  searchInput.addEventListener('input', function () {
    const query = searchInput.value.trim();
    renderDropdown(getMatches(query), query);
  });

  searchForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (!query) {
      return;
    }
    const matches = getMatches(query);
    if (matches.length > 0) {
      addClub(matches[0]);
      searchInput.value = '';
      searchDropdown.classList.remove('open');
    }
  });

  document.addEventListener('click', function (e) {
    if (!searchForm.contains(e.target)) {
      searchDropdown.classList.remove('open');
    }
  });

  /* ---- Comparison cards ---- */
  function addClub(name) {
    if (selectedClubs.indexOf(name) !== -1) {
      flashStatus(name + ' is already being compared.');
      return;
    }
    if (selectedClubs.length >= MAX_CLUBS) {
      flashStatus('You can only compare up to ' + MAX_CLUBS + ' clubs at a time. Remove one to add another.');
      return;
    }
    selectedClubs.push(name);
    renderCards();
    updateEmptyState();
  }

  function removeClub(name) {
    selectedClubs = selectedClubs.filter(function (n) { return n !== name; });
    renderCards();
    updateEmptyState();
  }

  function flashStatus(message) {
    statusLine.textContent = message;
  }

  function updateEmptyState() {
    emptyState.style.display = selectedClubs.length === 0 ? 'block' : 'none';
    if (selectedClubs.length > 0) {
      statusLine.textContent = 'Comparing ' + selectedClubs.length + ' of ' + MAX_CLUBS + ' clubs.';
    } else {
      statusLine.textContent = '';
    }
  }

  function buildNoDataSection(card, titleText) {
    const title = document.createElement('h3');
    title.className = 'compare-card-section-title';
    title.textContent = titleText;
    card.appendChild(title);

    const note = document.createElement('p');
    note.className = 'compare-card-no-data';
    note.textContent = 'No Data Available';
    card.appendChild(note);
  }

  function buildBarSection(card, titleText, items, labelKey, colors) {
    const title = document.createElement('h3');
    title.className = 'compare-card-section-title';
    title.textContent = titleText;
    card.appendChild(title);

    const maxRate = Math.max.apply(null, items.map(function (item) {
      return parseFloat(item.percentage);
    }));

    items.forEach(function (item, index) {
      const rate = parseFloat(item.percentage);
      const barWidth = maxRate > 0 ? (rate / maxRate) * 100 : 0;
      const color = colors[index % colors.length];

      const row = document.createElement('div');
      row.className = 'compare-card-bar-row';

      const labelRow = document.createElement('div');
      labelRow.className = 'compare-card-bar-label-row';

      const label = document.createElement('span');
      label.className = 'compare-card-bar-label';
      label.textContent = item[labelKey];

      const value = document.createElement('span');
      value.className = 'compare-card-bar-value';
      value.textContent = item.percentage + ' (' + item.fraction + ')';

      labelRow.appendChild(label);
      labelRow.appendChild(value);

      const track = document.createElement('div');
      track.className = 'compare-card-bar-track';

      const fill = document.createElement('div');
      fill.className = 'compare-card-bar-fill';
      fill.style.width = barWidth + '%';
      fill.style.backgroundColor = color;

      track.appendChild(fill);
      row.appendChild(labelRow);
      row.appendChild(track);
      card.appendChild(row);
    });
  }

  function buildCard(name) {
    const club = clubsData[name];

    const card = document.createElement('div');
    card.className = 'compare-card';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'compare-card-remove';
    removeBtn.setAttribute('aria-label', 'Remove ' + name);
    removeBtn.innerHTML = '&times;';
    removeBtn.addEventListener('click', function () {
      removeClub(name);
    });
    card.appendChild(removeBtn);

    const title = document.createElement('h2');
    title.className = 'compare-card-title';
    title.textContent = name;
    card.appendChild(title);

    const sub = document.createElement('p');
    sub.className = 'compare-card-sub';
    sub.textContent = 'Members: ' + club.current_member_count + ' \u2022 Alumni Tracked: ' + club.alumni_tracked;
    card.appendChild(sub);

    if (club.placements && Object.keys(club.placements).length > 0) {
      const placementsTitle = document.createElement('h3');
      placementsTitle.className = 'compare-card-section-title';
      placementsTitle.textContent = 'Placement Rates';
      card.appendChild(placementsTitle);

      Object.keys(club.placements).forEach(function (key) {
        const entry = club.placements[key];
        const row = document.createElement('div');
        row.className = 'compare-card-placement-row';

        const label = document.createElement('span');
        label.className = 'compare-card-placement-label';
        label.textContent = placementLabels[key] || key;

        const value = document.createElement('span');
        value.textContent = entry.percentage + ' (' + entry.fraction + ')';

        row.appendChild(label);
        row.appendChild(value);
        card.appendChild(row);
      });
    }

    if (club.top_5_industries && club.top_5_industries.length > 0) {
      buildBarSection(card, 'Top Industries', club.top_5_industries, 'industry', barColors);
    }

    if (club.grad_year_distribution) {
      if (club.grad_year_distribution === 'No Data Available') {
        buildNoDataSection(card, 'Class Year');
      } else if (club.grad_year_distribution.length > 0) {
        buildBarSection(card, 'Class Year', club.grad_year_distribution, 'class', gradYearColors);
      }
    }

    if (club.top_5_majors) {
      if (club.top_5_majors === 'No Data Available') {
        buildNoDataSection(card, 'Top Majors');
      } else if (club.top_5_majors.length > 0) {
        buildBarSection(card, 'Top Majors', club.top_5_majors, 'major', majorColors);
      }
    }

    return card;
  }

  function renderCards() {
    cardsContainer.innerHTML = '';
    selectedClubs.forEach(function (name) {
      cardsContainer.appendChild(buildCard(name));
    });
  }
</script>

</body>
</html>
